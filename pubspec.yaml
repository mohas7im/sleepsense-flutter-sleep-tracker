name: auto_sleep_tracker
description: >-
  Automatic, sensor-based sleep tracking for Flutter on Android. Detects
  sleep and wake from motion, screen, light and charging signals in a
  background service — no wearable required.
version: 0.1.0
repository: https://github.com/mohas7im/auto_sleep_tracker
issue_tracker: https://github.com/mohas7im/auto_sleep_tracker/issues
topics:
  - sleep
  - health
  - sensors
  - background-service
  - tracking

environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  battery_plus: ^7.1.1
  flutter_background_service: ^5.1.0
  health: ^13.3.2
  intl: ^0.20.2
  path: ^1.9.0
  pedometer: ^4.0.1
  permission_handler: ^11.3.1
  sensors_plus: ^7.1.0
  shared_preferences: ^2.5.0
  sqflite: ^2.4.0
  workmanager: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.mohas7im.auto_sleep_tracker
        pluginClass: AutoSleepTrackerPlugin
