name: sleep_sense
description: >-
  Automatic sleep tracking for Flutter apps on Android. Uses the phone's own
  sensors to detect when the user falls asleep and wakes up, with no wearable
  and no button to press.
version: 0.2.0
repository: https://github.com/mohas7im/SleepSense
issue_tracker: https://github.com/mohas7im/SleepSense/issues
topics:
  - sleep
  - health
  - sensors
  - background-service
  - tracking

environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  battery_plus: ^7.1.1
  flutter_background_service: ^5.1.0
  health: ^13.0.0
  intl: ^0.20.2
  path: ^1.9.0
  pedometer: ^4.0.1
  permission_handler: ^11.3.1
  sensors_plus: ^7.1.0
  shared_preferences: ^2.5.0
  sqflite: ^2.4.0
  workmanager: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.mohas7im.sleep_sense
        pluginClass: SleepSensePlugin
